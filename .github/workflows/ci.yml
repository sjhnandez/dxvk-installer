name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # If the XAML compiler ever fails under the dotnet CLI on CI,
      # switch this step to msbuild via microsoft/setup-msbuild.
      - name: Build app (WinUI 3, x64)
        run: dotnet build src/DxvkInstaller/DxvkInstaller.csproj -c Release -p:Platform=x64

      - name: Publish dry run (mirrors the release workflow)
        shell: pwsh
        run: |
          dotnet publish src/DxvkInstaller/DxvkInstaller.csproj -c Release -p:Platform=x64 -o "$env:RUNNER_TEMP\ci-publish"
          if (-not (Test-Path "$env:RUNNER_TEMP\ci-publish\DxvkInstaller.exe")) { throw "publish output missing" }

      - name: Run tests
        run: dotnet test tests/DxvkInstaller.Tests/DxvkInstaller.Tests.csproj -c Release --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'
          if-no-files-found: ignore
