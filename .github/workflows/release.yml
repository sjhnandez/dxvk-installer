name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release (e.g. v0.1.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.302"

      - name: Resolve version
        shell: pwsh
        run: |
          $version = "${{ inputs.version || github.ref_name }}"
          # Do NOT name this variable VERSION: MSBuild imports environment variables as properties,
          # and a tag like "v0.1.0" then breaks restore ("'v0.1.0' is not a valid version string.").
          echo "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      # win-x64 and self-contained are defined in DxvkInstaller.csproj on purpose:
      # passing -r/--self-contained here leaks them as global properties into
      # project references and broke restore on CI (NU1201).
      - name: Publish (self-contained, win-x64)
        run: dotnet publish src/DxvkInstaller/DxvkInstaller.csproj -c Release -p:Platform=x64 -o publish

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "dxvk-installer-$env:RELEASE_VERSION-win-x64.zip"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:RELEASE_VERSION" "dxvk-installer-$env:RELEASE_VERSION-win-x64.zip" --title "DXVK Installer $env:RELEASE_VERSION" --generate-notes --target "${{ github.sha }}"
